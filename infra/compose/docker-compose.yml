name: vulnhunter

x-backend-environment: &backend-environment
  ENVIRONMENT: development
  DOCS_ENABLED: ${DOCS_ENABLED:-true}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173,http://127.0.0.1:5173}
  DB_HOST: postgres
  DB_PORT: 5432
  DB_NAME: ${POSTGRES_DB:-vulnhunter}
  DB_USER: ${POSTGRES_USER:-vulnhunter}
  DB_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD in .env.docker}
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/0
  CELERY_RESULT_BACKEND: redis://redis:6379/1
  TASK_QUEUE_ENABLED: "true"
  REPORT_DIR: /data/reports

services:
  frontend:
    image: vulnhunter-frontend:local
    build:
      context: ../..
      dockerfile: infra/docker/frontend.Dockerfile
      args:
        VITE_API_URL: /api
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy

  api:
    image: vulnhunter-api:local
    build:
      context: ../..
      dockerfile: infra/docker/backend.Dockerfile
    environment: *backend-environment
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ../../artifacts/reports:/data/reports
    init: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    image: vulnhunter-api:local
    environment:
      <<: *backend-environment
      RUN_DB_MIGRATIONS: "false"
    command:
      - celery
      - -A
      - vulnhunter.tasks.celery_app:celery_app
      - worker
      - --loglevel=INFO
      - --queues=scans
      - --concurrency=1
      - --max-tasks-per-child=10
    volumes:
      - ../../artifacts/reports:/data/reports
    init: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "celery -A vulnhunter.tasks.celery_app:celery_app inspect ping --timeout=5 | grep -q pong"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 15s
    depends_on:
      api:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vulnhunter}
      POSTGRES_USER: ${POSTGRES_USER:-vulnhunter}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD in .env.docker}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
